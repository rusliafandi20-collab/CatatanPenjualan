name: Build Catatan Penjualan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catatan-penjualan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        run: |
          curl -fL --retry 3 --retry-all-errors \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          rm -rf /tmp/gradle-8.10.2
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle --version

      - name: Verify project structure
        run: |
          echo "=== Repository root ==="
          pwd
          ls -la
          test -f settings.gradle || { echo "ERROR: settings.gradle tidak ditemukan di root."; exit 1; }
          test -f build.gradle || { echo "ERROR: build.gradle tidak ditemukan di root."; exit 1; }
          test -f app/build.gradle || { echo "ERROR: app/build.gradle tidak ditemukan."; exit 1; }
          test -d app/src || { echo "ERROR: app/src tidak ditemukan."; exit 1; }
          echo "Project Android valid dan berada di root repository."

      - name: Build debug APK
        run: |
          /tmp/gradle-8.10.2/bin/gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Check APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: APK tidak ditemukan atau kosong: $APK"
            find app/build -type f 2>/dev/null || true
            exit 1
          fi
          echo "BUILD BERHASIL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPenjualan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
