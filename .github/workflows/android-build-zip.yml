name: Build Catatan Penjualan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada file ZIP project di repository."
            exit 1
          fi
          echo "Menggunakan: $ZIP_FILE"
          rm -rf _android_project
          mkdir -p _android_project
          unzip -q "$ZIP_FILE" -d _android_project

          PROJECT_DIR="_android_project"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            FOUND=$(find "$PROJECT_DIR" -type f -name settings.gradle -print -quit)
            if [ -z "$FOUND" ]; then
              echo "ERROR: settings.gradle tidak ditemukan di dalam ZIP."
              find "$PROJECT_DIR" -maxdepth 4 -type f | sort
              exit 1
            fi
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          rm -rf "$HOME/gradle-8.10.2"
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Check APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "BUILD BERHASIL: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPenjualan-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
