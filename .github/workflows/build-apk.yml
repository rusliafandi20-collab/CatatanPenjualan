name: Build Catatan Penjualan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catatan-penjualan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify project
        run: |
          echo "=== PROJECT STRUCTURE ==="
          ls -la

          test -f settings.gradle || exit 1
          test -f build.gradle || exit 1
          test -f app/build.gradle || exit 1
          test -d app/src || exit 1

          echo "Android project ditemukan di ROOT repository."

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Check APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan!"
            find app/build -type f 2>/dev/null || true
            exit 1
          fi

          echo "BUILD BERHASIL!"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPenjualan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
