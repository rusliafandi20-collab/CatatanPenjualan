name: Build Catatan Penjualan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Ekstrak project Android
        run: |
          unzip -q CatatanPenjualan-VersiProfesionalPlus-v6-GitHub.zip
          cd PenjualanHarian
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: PenjualanHarian
        run: gradle --no-daemon assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPenjualan-APK
          path: PenjualanHarian/app/build/outputs/apk/debug/app-debug.apk
